<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Refer a student — Zolve</title>
  <!-- A public page: no sign-in, and deliberately not indexed. The link is
       the credential, so it should not turn up in a search result. -->
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,560&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/design-tokens.css">
  <link rel="stylesheet" href="css/form.css">
</head>
<body>
  <main class="pf-wrap">
    <header class="pf-head">
      <div class="pf-brand">Zolve Tangent</div>
      <h1 id="pfTitle">Refer a student</h1>
      <p class="pf-sub" id="pfSub">Checking your link…</p>
    </header>

    <!-- Shown when the token is missing, wrong or revoked. -->
    <section id="pfClosed" class="pf-card pf-closed" hidden>
      <h2>This link isn’t active</h2>
      <p>Ask your Zolve contact to send you a current one.</p>
    </section>

    <!-- Shown after a successful submission. -->
    <section id="pfDone" class="pf-card pf-done" hidden>
      <div class="pf-tick" aria-hidden="true">✓</div>
      <h2 id="pfDoneTitle">Thank you</h2>
      <p id="pfDoneMsg"></p>
      <button type="button" class="pf-btn pf-btn-ghost" id="pfAnother">Refer another student</button>
    </section>

    <form id="pfForm" class="pf-card" hidden novalidate>
      <div class="pf-field">
        <label for="student_name">Student’s full name <span aria-hidden="true">*</span></label>
        <input id="student_name" name="student_name" type="text" autocomplete="name" required>
        <p class="pf-err" data-err="student_name"></p>
      </div>

      <div class="pf-field">
        <label for="phone">Mobile number <span aria-hidden="true">*</span></label>
        <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel"
               placeholder="10-digit mobile" required>
        <p class="pf-hint">The team will call this number.</p>
        <p class="pf-err" data-err="phone"></p>
      </div>

      <div class="pf-field">
        <label for="amount">Loan amount needed (₹) <span aria-hidden="true">*</span></label>
        <input id="amount" name="amount" type="text" inputmode="numeric" required>
        <p class="pf-hint" id="amountWords"></p>
        <p class="pf-err" data-err="amount"></p>
      </div>

      <div class="pf-row">
        <div class="pf-field">
          <label for="country">Study country</label>
          <select id="country" name="country">
            <option value="">Select…</option>
            <option>UK</option><option>USA</option><option>Canada</option>
            <option>Australia</option><option>Germany</option><option>Ireland</option>
            <option>New Zealand</option><option>France</option><option>Singapore</option>
            <option>UAE</option><option>Other</option>
          </select>
        </div>
        <div class="pf-field">
          <label for="intake">Intake</label>
          <select id="intake" name="intake">
            <option value="">Select…</option>
          </select>
        </div>
      </div>

      <div class="pf-field">
        <label for="university">University / college</label>
        <input id="university" name="university" type="text">
      </div>

      <div class="pf-field">
        <label for="course">Course</label>
        <input id="course" name="course" type="text">
      </div>

      <div class="pf-field">
        <label for="email">Student’s email</label>
        <input id="email" name="email" type="email" autocomplete="email">
        <p class="pf-err" data-err="email"></p>
      </div>

      <p class="pf-note" id="pfFormNote"></p>
      <p class="pf-err pf-err-top" data-err="form"></p>
      <button type="submit" class="pf-btn" id="pfSubmit">Send to Zolve</button>
      <p class="pf-privacy">
        Only share a student’s details with their knowledge. Zolve uses them to
        assess an education loan and nothing else.
      </p>
    </form>
  </main>

  <script src="../../shared/env.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
