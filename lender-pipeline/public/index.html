<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lender Pipeline · Zolve Tangent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,560;9..144,650&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="../../shared/design-tokens.css" />
<link rel="stylesheet" href="../../shared/css/app-nav.css" />
<link rel="stylesheet" href="../../shared/css/components.css" />
<link rel="stylesheet" href="../../shared/css/page-kit.css" />
<link rel="stylesheet" href="css/pipeline.css" />
<script>try{var t=localStorage.getItem('zt-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="icon" type="image/svg+xml" href="../../shared/img/favicon.svg" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand"><span class="brand-mark">Z</span><span class="brand-name">Zolve <span class="brand-accent">Tangent</span></span></div>
      <nav class="sidebar-nav">
        <a class="nav-item active" data-view="pipeline" href="#"><i class="fa-solid fa-building-columns"></i> Pipeline</a>
        <a class="nav-item" data-view="profile" href="#"><i class="fa-solid fa-id-card"></i> Bank Details</a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-chip"><div class="avatar" id="avatar">–</div><div class="user-meta"><span class="user-name" id="userName">Loading…</span><span class="user-role" id="orgName">–</span></div></div>
      </div>
    </aside>

    <main class="main">
      <div id="ztTopbar" class="zt-topbar"></div>
      <div id="pipelinePanel">
        <header class="pp-head">
          <div>
            <p class="pp-eyebrow">Lender pipeline</p>
            <h1 class="pp-title" id="lpTitle">Your cases</h1>
            <p class="pp-blurb" id="lpBlurb">Only cases Zolve Tangent has shared with your institution.</p>
          </div>
          <div class="pp-actions"><button class="btn btn-ghost" id="btnExport"><i class="fa-solid fa-download"></i> Export view</button></div>
        </header>

        <section class="pp-stats" id="lpStats"><div class="spinner-block"><span class="spinner"></span><span>Loading…</span></div></section>
        <section class="insights" id="lpInsights" hidden></section>
        <nav class="pp-stages" id="lpStages" aria-label="Filter by stage"></nav>

        <section class="pp-panel">
          <div class="pp-toolbar">
            <div class="pp-tabs" id="lpTabs" role="tablist"></div>
            <input type="search" class="pp-search" id="lpSearch" placeholder="Search student, course or university" />
          </div>
          <div class="pp-hint" id="lpHint"></div>
          <div class="pp-table-wrap">
            <table class="pp-table">
              <thead><tr><th>Student</th><th>Stage</th><th>Time at stage</th><th class="r">Requested</th><th class="r">Sanctioned</th><th class="r">Queries</th></tr></thead>
              <tbody id="dealsBody"><tr><td colspan="6"><div class="spinner-block"><span class="spinner"></span><span>Loading…</span></div></td></tr></tbody>
            </table>
          </div>
          <div class="pp-more" id="lpMore" hidden></div>
        </section>
      </div>

      <div id="profilePanel" hidden>
        <header class="main-header"><div><h1>Bank details</h1><p class="subtitle">Keep your institution's contact info current for our team.</p></div></header>
        <form id="profileForm" class="table-card" style="padding:24px;max-width:520px;">
          <div class="form-field"><label>Institution name</label><input name="name" type="text" disabled /></div>
          <div class="form-field"><label>Contact person</label><input name="contact_person_name" type="text" /></div>
          <div class="form-field"><label>Contact email</label><input name="contact_email" type="email" /></div>
          <div class="form-field"><label>Contact phone</label><input name="contact_phone" type="tel" /></div>
          <div class="form-field"><label>Registered address</label><textarea name="registered_address" rows="2"></textarea></div>
          <div class="form-field"><label>Processing notes</label><textarea name="processing_notes" rows="2" placeholder="e.g. Sanctions typically take 5-7 business days"></textarea></div>
          <button type="submit" class="btn btn-primary" style="margin-top:8px;">Save changes</button>
        </form>
      </div>
    </main>
  </div>

  <div class="drawer-overlay" id="drawerOverlay" hidden>
    <aside class="drawer">
      <div class="drawer-header"><div><h2 id="drawerName">–</h2><span class="drawer-subtitle" id="drawerSubtitle">–</span></div><button class="icon-btn" id="btnCloseDrawer"><i class="fa-solid fa-xmark"></i></button></div>
      <nav class="drawer-tabs">
        <button class="tab-btn active" data-tab="manage">Manage</button>
        <button class="tab-btn" data-tab="profile">Student Profile</button>
        <button class="tab-btn" data-tab="queries">Queries</button>
        <button class="tab-btn" data-tab="messages">Messages</button>
      </nav>
      <div class="drawer-body">
        <div class="tab-panel active" data-panel="manage" id="panelManage"></div>
        <div class="tab-panel" data-panel="profile" id="panelProfile"></div>
        <div class="tab-panel" data-panel="queries" id="panelQueries"></div>
        <div class="tab-panel" data-panel="messages" id="panelMessages"></div>
      </div>
    </aside>
  </div>

  <div class="toast" id="toast" hidden></div>
  <script src="../../shared/env.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
