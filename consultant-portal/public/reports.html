<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Report · Zolve Tangent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,560;9..144,650&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="../../shared/design-tokens.css" />
<link rel="stylesheet" href="../../shared/css/app-nav.css" />
<link rel="stylesheet" href="../../shared/css/components.css" />
<link rel="stylesheet" href="css/portal.css" />
<script>try{var t=localStorage.getItem('zt-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand"><span class="brand-mark">Z</span><span class="brand-name">Zolve <span class="brand-accent">Tangent</span></span></div>
      <nav class="sidebar-nav">
        <a class="nav-item" href="index.html"><i class="fa-solid fa-user-graduate"></i> My Students</a>
        <a class="nav-item active" href="reports.html"><i class="fa-solid fa-chart-column"></i> My Report</a>
        <a class="nav-item" href="profile.html"><i class="fa-solid fa-id-badge"></i> Profile</a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-chip"><div class="avatar" id="avatar">–</div><div class="user-meta"><span class="user-name" id="userName">Loading…</span><span class="user-role">Consultant</span></div></div>
      </div>
    </aside>

    <main class="main" style="max-width:960px;">
      <div id="ztTopbar" class="zt-topbar"></div>
      <header class="main-header">
        <div><h1>My report</h1><p class="subtitle">Your students, and how far they've got with the banks.</p></div>
      </header>

      <section class="table-card" style="padding:20px;margin-bottom:20px;">
        <div class="bd-toolbar">
          <div class="period-toggle" id="cpPresets">
            <button type="button" class="pill-btn" data-days="30">30d</button>
            <button type="button" class="pill-btn" data-days="90">90d</button>
            <button type="button" class="pill-btn" data-days="365">1y</button>
            <button type="button" class="pill-btn active" data-days="all">Overall</button>
          </div>
          <span class="bd-toolbar-spacer"></span>
          <button type="button" class="btn btn-ghost" id="cpCsv"><i class="fa-solid fa-file-arrow-down"></i> Download CSV</button>
        </div>
        <div id="cpTotals"><div class="spinner-block"><span class="spinner"></span><span>Loading…</span></div></div>
      </section>

      <section class="table-card" style="padding:20px;">
        <h3 class="bd-subhead">Where your students are</h3>
        <p class="bd-subnote">Every student you've submitted, by the stage they're at right now.</p>
        <div id="cpStages"><div class="spinner-block"><span class="spinner"></span><span>Loading…</span></div></div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" hidden></div>
  <script src="../../shared/env.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="js/reports.js"></script>
</body>
</html>
