<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Activity Forms · Zolve Tangent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,650&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="../../shared/design-tokens.css">
<link rel="stylesheet" href="../../shared/css/app-nav.css">
<link rel="stylesheet" href="../../shared/css/components.css">
<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="css/activity-forms.css">
<script>try{var t=localStorage.getItem('zt-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="icon" type="image/svg+xml" href="../../shared/img/favicon.svg" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="brand-mark">Z</span><span class="brand-name">Zolve <span class="brand-accent">Tangent</span></span></div>
    <nav class="sidebar-nav">
      <a data-roles="Admin" class="nav-item" href="index.html#overview"><i class="fa-solid fa-gauge-high"></i> Overview</a>
      <a data-roles="Admin" class="nav-item" href="index.html#smart-views"><i class="fa-solid fa-layer-group"></i> Smart Views</a>
      <a class="nav-item active" href="activity-forms.html"><i class="fa-solid fa-clipboard-list"></i> Activity Forms</a>
      <a data-roles="Admin" class="nav-item" href="index.html#settings"><i class="fa-solid fa-gear"></i> Settings</a>
    </nav>
    <div class="sidebar-footer">
      <div class="user-chip"><div class="avatar" id="avatar">–</div><div class="user-meta"><span class="user-name" id="userName">Loading…</span><span class="user-role" id="userRole">–</span></div></div>
    </div>
  </aside>

  <main class="main">
    <div id="ztTopbar" class="zt-topbar"></div>
    <header class="main-header">
      <div>
        <h1>Activity forms</h1>
        <p class="subtitle">Build a form once, fill it against any lead. Every submission is stored as an activity you can report on and segment by.</p>
      </div>
      <button class="btn btn-primary" id="btnNewForm"><i class="fa-solid fa-plus"></i> New form</button>
    </header>

    <div class="af-layout">
      <!-- form list -->
      <aside class="af-list card">
        <div class="card-heading"><h2>Forms</h2></div>
        <div id="afFormList"><p class="empty-state">Loading…</p></div>
      </aside>

      <!-- editor -->
      <section class="af-editor card">
        <div id="afEditor">
          <p class="empty-state">Select a form on the left, or create one.</p>
        </div>
      </section>
    </div>
  </main>
</div>

<div id="toast" class="toast" hidden></div>
<script src="../../shared/env.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="js/activityForms.js"></script>
</body>
</html>
