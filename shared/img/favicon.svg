<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Tab icon: the same golden spiral, on a solid accent tile so it holds up
       against both a light and a dark browser chrome. Square because favicons
       are square; the spiral keeps its 1.618 : 1 box centred inside.

       The construction is 161.8 x 100, scaled by 0.173 to span 28px of the
       32px tile and centred vertically at y = (32 - 17.3) / 2.

       NOTE: no double hyphen may appear anywhere in this comment. XML forbids
       it and a parse error here shows up as a missing icon, nothing louder. -->
  <rect width="32" height="32" rx="7" fill="#2554C7"/>
  <g transform="translate(2 7.35) scale(0.173)" fill="none" stroke="#fff"
     stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 100
             A100 100 0 0 1 100 0
             A61.8 61.8 0 0 1 161.8 61.8
             A38.2 38.2 0 0 1 123.6 100
             A23.6 23.6 0 0 1 100 76.4"/>
  </g>
</svg>
