<svg xmlns="http://www.w3.org/2000/svg" viewBox="-7 -7 176 114" fill="none"
     stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
  <!-- Golden spiral without a drawn frame, for use where the tile itself is
       the golden rectangle. Same construction: box 161.8 x 100, arc radii
       100, 61.8, 38.2, 23.6, each a quarter turn inscribed in its square.

       NOTE: no double hyphen may appear anywhere in this comment. XML forbids
       it, and this file is consumed as a CSS mask, so a parse error surfaces
       nowhere. The mask silently resolves to empty and the logo disappears. -->
  <path d="M0 100
           A100 100 0 0 1 100 0
           A61.8 61.8 0 0 1 161.8 61.8
           A38.2 38.2 0 0 1 123.6 100
           A23.6 23.6 0 0 1 100 76.4"
        stroke-width="11"/>
</svg>
