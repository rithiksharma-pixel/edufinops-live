<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Partner Reports · Zolve Tangent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,560;9..144,650&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="../../shared/design-tokens.css" />
<link rel="stylesheet" href="../../shared/css/app-nav.css" />
<link rel="stylesheet" href="../../shared/css/components.css" />
<link rel="stylesheet" href="../../shared/css/lead-drawer.css" />
<link rel="stylesheet" href="css/dashboard.css" />
<script>try{var t=localStorage.getItem('zt-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand"><span class="brand-mark">Z</span><span class="brand-name">Zolve <span class="brand-accent">Tangent</span></span></div>
      <nav class="sidebar-nav">
        <a class="nav-item" href="index.html"><i class="fa-solid fa-chart-line"></i> Team Dashboard</a>
        <a class="nav-item active" href="reports.html"><i class="fa-solid fa-handshake"></i> Partner Reports</a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-chip"><div class="avatar" id="avatar">–</div><div class="user-meta"><span class="user-name" id="userName">Loading…</span><span class="user-role" id="userRole">–</span></div></div>
      </div>
    </aside>

    <main class="main" style="max-width:1180px;">
      <div id="ztTopbar" class="zt-topbar"></div>
      <header class="main-header">
        <div>
          <h1>Partner reports</h1>
          <p class="subtitle">Per-consultancy funnel, conversion and ageing — ready to share.</p>
        </div>
      </header>

      <!-- Honest framing up top rather than a footnote nobody reads. -->
      <div class="report-note" id="dataNote"></div>

      <section class="filter-bar" style="margin-bottom:18px;">
        <div class="filter-field">
          <label for="repFrom">Leads created from</label>
          <input type="date" id="repFrom" />
        </div>
        <div class="filter-field">
          <label for="repTo">To</label>
          <input type="date" id="repTo" />
        </div>
        <div class="filter-field">
          <label for="repSearch">Search consultancy</label>
          <input type="search" id="repSearch" placeholder="Name…" />
        </div>
        <div class="filter-field">
          <label for="repMin">Min leads</label>
          <input type="number" id="repMin" min="0" value="0" style="width:90px;" />
        </div>
        <div class="filter-actions">
          <button class="btn btn-ghost" id="repClear">Clear</button>
          <button class="btn btn-primary" id="repExportAll"><i class="fa-solid fa-download"></i> Export all</button>
        </div>
      </section>

      <section class="table-card">
        <div class="lead-count" id="repCount" aria-live="polite"></div>
        <div style="overflow-x:auto;">
          <table class="lead-table" id="repTable">
            <thead>
              <tr>
                <th>Consultancy</th>
                <th class="num">Leads</th>
                <th class="num">Login</th>
                <th class="num">Sanction</th>
                <th class="num">PF Paid</th>
                <th class="num">Disb.</th>
                <th class="num">Lost</th>
                <th class="num">Lead→Login</th>
                <th class="num">→Disb.</th>
                <th class="num">Avg age</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="repBody">
              <tr><td colspan="11"><div class="spinner-block"><span class="spinner"></span><span>Loading report…</span></div></td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- Per-consultancy detail -->
  <div class="drawer-overlay" id="repOverlay" hidden></div>
  <aside class="drawer" id="repDrawer" hidden aria-label="Consultancy detail">
    <header class="drawer-header">
      <div>
        <h2 id="repDrawerName">–</h2>
        <p class="subtitle" id="repDrawerSub">–</p>
      </div>
      <button class="btn btn-ghost" id="repDrawerClose" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
    </header>
    <div class="drawer-body" id="repDrawerBody"></div>
  </aside>

  <script type="module" src="js/reports.js"></script>
</body>
</html>
