<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Weekly Business Review · Zolve Tangent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,560;9..144,650&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="../../shared/design-tokens.css" />
<link rel="stylesheet" href="../../shared/css/app-nav.css" />
<link rel="stylesheet" href="../../shared/css/components.css" />
<link rel="stylesheet" href="css/dashboard.css" />
<link rel="stylesheet" href="css/weekly-review.css" />
<script>try{var t=localStorage.getItem('zt-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="icon" type="image/svg+xml" href="../../shared/img/favicon.svg" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand"><span class="brand-mark">Z</span><span class="brand-name">Zolve <span class="brand-accent">Tangent</span></span></div>
      <nav class="sidebar-nav">
        <a class="nav-item" href="index.html"><i class="fa-solid fa-chart-line"></i> Team Dashboard</a>
        <a class="nav-item" href="reports.html"><i class="fa-solid fa-handshake"></i> Partner Reports</a>
        <a class="nav-item active" href="weekly-review.html"><i class="fa-solid fa-file-powerpoint"></i> Weekly Review</a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-chip"><div class="avatar" id="avatar">–</div><div class="user-meta"><span class="user-name" id="userName">Loading…</span><span class="user-role" id="userRole">–</span></div></div>
      </div>
    </aside>

    <main class="main" style="max-width:1180px;">
      <div id="ztTopbar" class="zt-topbar"></div>
      <header class="main-header">
        <div>
          <h1>Weekly Business Review</h1>
          <p class="subtitle">An executive deck built from live CRM data — charts, trends and commentary, exported to PowerPoint or PDF.</p>
        </div>
      </header>

      <div class="report-tabs" role="tablist">
        <button class="report-tab active" role="tab" data-tab="generate"><i class="fa-solid fa-bolt"></i> Generate</button>
        <button class="report-tab" role="tab" data-tab="history"><i class="fa-solid fa-folder-open"></i> Weekly Reviews</button>
        <button class="report-tab" role="tab" data-tab="targets"><i class="fa-solid fa-bullseye"></i> Targets</button>
      </div>

      <!-- ============ GENERATE ============ -->
      <section id="paneGenerate">
        <div class="wr-launch">
          <div class="form-field" style="max-width:220px;">
            <label for="wrWeekEnd">Week ending</label>
            <input type="date" id="wrWeekEnd" />
          </div>
          <button class="btn btn-primary wr-cta" id="btnGenerate">
            <i class="fa-solid fa-chart-column"></i> Generate Weekly Review
          </button>
        </div>

        <div class="wr-progress-card" id="wrProgress" hidden>
          <div class="wr-bar-track"><div class="wr-bar" id="wrBar"></div></div>
          <p class="wr-progress-label" id="wrProgressLabel">Starting…</p>
          <ol class="wr-steps" id="wrSteps"></ol>
        </div>

        <div class="wr-exports" id="wrExports" hidden>
          <span class="wr-deck-meta" id="wrDeckMeta"></span>
          <div class="wr-export-btns">
            <button class="btn btn-primary" id="btnPptx"><i class="fa-solid fa-file-powerpoint"></i> Download PowerPoint</button>
            <button class="btn btn-ghost" id="btnPdf"><i class="fa-solid fa-file-pdf"></i> Download PDF</button>
          </div>
        </div>

        <div id="wrDeck" class="wr-deck"></div>
      </section>

      <!-- ============ HISTORY ============ -->
      <section id="paneHistory" hidden>
        <div class="card"><div class="card-heading"><h2>Weekly Reviews</h2></div>
          <div id="wrHistory"><p class="wr-none">Loading…</p></div>
        </div>
      </section>

      <!-- ============ TARGETS ============ -->
      <section id="paneTargets" hidden>
        <div class="card"><div class="card-heading"><h2>Targets</h2></div>
          <div id="wrTargets"><p class="wr-none">Loading…</p></div>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
  <script type="module" src="js/weeklyReview.js"></script>
</body>
</html>
